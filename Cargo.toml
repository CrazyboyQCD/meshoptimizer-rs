[package]
name = "rmeshopt"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Safe, no_std-capable Rust port of meshoptimizer: mesh processing algorithms that make meshes ready for GPU consumption"
license = "MIT"
repository = "https://github.com/CrazyboyQCD/rmeshopt"
categories = ["graphics", "encoding", "no-std"]
keywords = ["mesh", "meshoptimizer", "gltf", "no_std", "compression"]
exclude = ["ci", "bench"]

[features]
default = ["std"]
# Uses the platform standard library for math; disable for no_std builds (libm backend).
std = []
# Opt-in SIMD kernels (ADR-0012): compile-time dispatch, no runtime detection.
# x86_64: `simd` assumes SSSE3+POPCNT (vertex decode) and SSE4.1 (meshlet
# decode), as upstream compiled with `-mssse3 -mpopcnt -msse4.1`; running on
# an older CPU faults. `simd-avx512` swaps in the AVX512-VBMI2 vertex-decode
# kernel (upstream's SIMD_AVX compile gate) and must only run on AVX512
# hardware. aarch64: NEON (baseline, no detection). wasm32: SIMD128 (compile
# with `-C target-feature=+simd128`). Pure core, so no_std builds can enable
# the feature; unsupported architectures get the scalar kernels.
simd = []
simd-avx512 = ["simd"]

[dependencies]
libm = "0.2"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
